[package]
name = "nix-store-mesh"
version = "0.1.0"
edition = "2024"

[dependencies]
hostname = "0.4"
log = "0.4"
env_logger = "0.11"
axum = { version = "0.8.7", features = ["macros", "http2"] }
hyper = { version = "1.8.1", features = ["client", "http2"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
once_cell = "1.21.3"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.12", features = ["io", "rt"] }
toml = "0.9"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["compression-full"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }
